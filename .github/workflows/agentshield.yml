name: AgentShield
on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AgentShield
        run: pip install .
      - name: Scan repository
        run: agentshield . --sarif agentshield.sarif --html agentshield-report.html --graph agentshield-blast-radius.mmd --fail-on high --min-score 80
      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: agentshield.sarif
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentshield-report
          path: |
            agentshield-report.html
            agentshield-blast-radius.mmd
