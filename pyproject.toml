[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield-security"
version = "1.3.0"
description = "AI-agent and multi-cloud security posture scanner with AWS, Azure and GCP identity blast-radius analysis."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Kumud Kishore"}]
keywords = ["ai-security", "agent-security", "cloud-security", "aws-security", "azure-security", "gcp-security", "iam", "rbac", "sarif", "devsecops", "llm-security"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Security"
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
azure = ["azure-identity>=1.17", "azure-mgmt-subscription>=3.1", "azure-mgmt-authorization>=4.0", "azure-mgmt-resource>=23.1", "requests>=2.31"]
gcp = ["google-auth>=2.35", "requests>=2.31"]
cloud = ["boto3>=1.34", "azure-identity>=1.17", "azure-mgmt-subscription>=3.1", "azure-mgmt-authorization>=4.0", "azure-mgmt-resource>=23.1", "google-auth>=2.35", "requests>=2.31"]
dev = ["pytest>=8"]

[project.scripts]
agentshield = "agentshield.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
